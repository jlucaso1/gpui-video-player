[package]
name = "gpui-video-player"
version = "0.1.2"
edition = "2024"
exclude = ["assets"]
authors = ["nemurubaka <cijiugechu@gmail.com>"]
description = "A video player library for gpui applications, built on top of GStreamer."
homepage = "https://github.com/cijiugechu/gpui-video-player"
repository = "https://github.com/cijiugechu/gpui-video-player"
license = "MIT"
readme = "README.md"
keywords = ["gpui", "video", "player", "gstreamer"]
categories = ["multimedia"]
documentation = "https://docs.rs/gpui-video-player"

[dependencies]
gpui = "0.2.2"
gstreamer = "0.24"
gstreamer-app = "0.24" # appsink
gstreamer-base = "0.24" # basesrc
gstreamer-video = "0.24" # video info/frames (stride-aware copies)
glib = "0.21" # gobject traits and error type
log = "0.4"
thiserror = "2"
url = "2" # media uri
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp"] }
smallvec = "1"
yuv = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-video = "0.4"
core-foundation = "0.10"

[dev-dependencies]
env_logger = "0.11"
# gpui-component = "0.5" # Temporarily disabled - incompatible with gpui git

# Workaround for zvariant_derive 5.9.0 breaking change that broke ashpd and other crates
# See: https://github.com/dbus2/zbus/issues/1665
# See: https://github.com/bilelmoussaoui/ashpd/issues/323
# Pin to zvariant-5.8.0 tag until the issue is resolved upstream
[patch.crates-io]
zbus = { git = "https://github.com/dbus2/zbus.git", tag = "zvariant-5.8.0" }
zbus_macros = { git = "https://github.com/dbus2/zbus.git", tag = "zvariant-5.8.0" }
zbus_names = { git = "https://github.com/dbus2/zbus.git", tag = "zvariant-5.8.0" }
zvariant = { git = "https://github.com/dbus2/zbus.git", tag = "zvariant-5.8.0" }
zvariant_derive = { git = "https://github.com/dbus2/zbus.git", tag = "zvariant-5.8.0" }
zvariant_utils = { git = "https://github.com/dbus2/zbus.git", tag = "zvariant-5.8.0" }

# Use gpui with YUV surface support for Linux/Windows
gpui = { git = "https://github.com/jlucaso1/zed.git", branch = "gpui-yuv-surface-linux-windows", package = "gpui" }

